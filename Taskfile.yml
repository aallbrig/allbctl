version: '3'

tasks:
  # ── Composite tasks ──────────────────────────────────────────────────────────

  dev:
    desc: Start the allbctl tmux dev session (bootstrap + sites + watchers)
    cmds:
      - tmuxinator start -p .tmuxinator/allbctl.yml

  ci:
    desc: Run all quality gates sequentially (fmt, vet, lint, test, vuln, docs, secrets)
    cmds:
      - task: fmt-check
      - task: vet
      - task: lint-go
      - task: lint-shell
      - task: test
      - task: vuln
      - task: docs-check
      - task: secrets
      - echo "✓ All quality gates passed."

  # ── Individual quality gates ─────────────────────────────────────────────────

  fmt-check:
    desc: Verify all Go files are gofmt-formatted
    cmds:
      - |
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "FAIL: unformatted files:" && echo "$UNFORMATTED" && exit 1
        fi
        echo "PASS: all files formatted"

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run all linters (go + shell)
    deps:
      - lint-go
      - lint-shell

  lint-go:
    desc: Run golangci-lint on Go sources
    cmds:
      - golangci-lint run ./...

  lint-shell:
    desc: Run shellcheck on all tracked shell scripts
    cmds:
      - |
        scripts=$(git ls-files '*.sh')
        if [ -n "$scripts" ]; then
          echo "$scripts" | xargs shellcheck
        fi

  test:
    desc: Run all Go tests
    cmds:
      - go test -timeout 120s ./...

  vuln:
    desc: Check for known vulnerabilities with govulncheck
    cmds:
      - govulncheck ./...

  docs-check:
    desc: Verify generated CLI reference docs are in sync with cobra commands
    cmds:
      - go run main.go gen-docs && git diff --exit-code hugo/site/content/docs/reference/

  secrets:
    desc: Scan for secrets with gitleaks (entrypoint for secret scanning)
    cmds:
      - gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
